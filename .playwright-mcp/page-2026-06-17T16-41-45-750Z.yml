            - paragraph [ref=e600]: This article is detailed, so I’ve made it easy to apply without memorizing all of it. Below is a system prompt you can drop into a project instruction if you use ChatGPT or Claude on web or mobile.
            - figure [ref=e602]:
              - link [ref=e603]:

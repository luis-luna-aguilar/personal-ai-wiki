            - paragraph [ref=e613]:
              - text: And if you’re comfortable with coding agents like Codex or Claude Code, here’s a
              - link "skill" [ref=e614] [cursor=pointer]:
                - /url: https://github.com/amydeng2000/health-self-investigation-skill
              - text: I built that starts with a short symptom intake and routes you to the right phase of the four-step process. It takes a little more setup but is more comprehensive than the system prompt alone.
            - 'heading "Appendix II: Bulid Your Personal Health Stack Link" [level=2] [ref=e615]':
              - text: "Appendix II: Bulid Your Personal Health Stack"
              - button "Link" [ref=e618] [cursor=pointer]:
                - img [ref=e619]
            - paragraph [ref=e622]: "AI’s coding and research capabilities are now good enough for each of us to build personalized health tools for our own needs. Just bring your problem, and you can get the models to scaffold themselves to solve it. A few examples that come to mind:"
            - paragraph [ref=e623]: Can’t remember to track things hourly? Set up a ChatGPT scheduled task that pings you every hour, or a long-running Claude app that texts you and logs your responses in a spreadsheet.
            - paragraph [ref=e624]: Don’t want to log what you ate, let alone upload the photos manually? Run a scheduled job that pulls food photos from your iCloud daily.
            - paragraph [ref=e625]:
              - text: Have too much data across hospitals, labs, and devices, and need to catch a new doctor up on your past treatments? Build a website to visualize things, as GitLab co-founder Sid did with his own cancer data
              - link "here" [ref=e626] [cursor=pointer]:
                - /url: https://osteosarc.com/
              - text: .
            - paragraph [ref=e627]: Every small, personalized improvement in how you collect, organize, and analyze data is now within reach, and anyone can build something custom. The biggest unlock still ahead, I think, is continuous monitoring beyond blood glucose—hormone monitoring, for instance—which could give us a far more granular view of how the body’s systems interact.

              - paragraph [ref=e659]: Function Health doesn’t let you bulk-export results until a clinician writes a summary, which takes weeks. So I had Codex use browser automation to read the results straight off my screen once I’d logged in, and pull every abnormal test’s name, value, and reference range, plus brief summaries of the in-range results.
